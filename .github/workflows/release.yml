# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: release
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # npm signs in through trusted publishing (OIDC), so no token secret is needed.
      - run: npm publish --provenance --access public
      - name: Move the major tag to this release
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          MAJOR: ${{ needs.release.outputs.major }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -f "v$MAJOR" "$TAG"
          git push -f origin "refs/tags/v$MAJOR"
