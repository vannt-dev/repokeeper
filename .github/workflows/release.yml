# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: release
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # npm signs in through trusted publishing (OIDC), so no token secret is needed.
      - run: npm publish --provenance --access public
      - name: Move the major tag to this release
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          MAJOR: ${{ needs.release.outputs.major }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -f "v$MAJOR" "$TAG"
          git push -f origin "refs/tags/v$MAJOR"
  release-pr-ci:
    needs: release
    if: ${{ needs.release.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.release.outputs.pr_branch }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&event=pull_request&status=action_required" --jq '.workflow_runs[].id')
            [ -n "$ids" ] && break
            sleep 10
          done
          if [ -z "$ids" ]; then echo "::notice::no held runs for $BRANCH"; fi
          for id in $ids; do gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; done
